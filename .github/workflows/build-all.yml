name: Build All Flavors

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the release with (e.g. 1.0.0)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release (otherwise assets are only staged as a dry run)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: linux-x64
            os: ubuntu-latest
            script: ./build_linux-x64.sh
          - flavor: linux-arm64
            os: ubuntu-latest
            script: ./build_linux-arm64.sh
          - flavor: osx-x64
            os: macos-latest
            script: ./build_osx-x64.sh
          - flavor: osx-arm64
            os: macos-latest
            script: ./build_osx-arm64.sh
          - flavor: win-x64
            os: windows-latest
            script: build_win-x64.bat
          - flavor: win-arm64
            os: windows-latest
            script: build_win-arm64.bat
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: src/global.json

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Set up macOS signing
        if: runner.os == 'macOS' && secrets.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail

          # A throwaway keychain, so nothing is left behind on the runner.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"

          # Without this codesign prompts for permission, and hangs with nobody to answer.
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          if [ -n "${MACOS_NOTARY_APPLE_ID:-}" ]; then
            xcrun notarytool store-credentials "freerealms" --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --keychain "$KEYCHAIN"
          fi

      - name: Build (Unix)
        if: runner.os != 'Windows'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALL_IDENTITY: ${{ secrets.MACOS_INSTALL_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          chmod +x "${{ matrix.script }}"
          "${{ matrix.script }}" "${{ inputs.version }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: ${{ matrix.script }} "${{ inputs.version }}"
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FreeRealmsLegacyLauncher-${{ inputs.version }}-${{ matrix.flavor }}
          path: releases/
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p staging

          for dir in artifacts/*/; do
            channel=""
            for manifest in "$dir"releases.*.json; do
              channel="$(basename "$manifest" .json)"
              channel="${channel#releases.}"
            done

            if [ -z "$channel" ]; then
              echo "::error::No releases.*.json manifest found in $dir"
              exit 1
            fi

            for file in "$dir"*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              case "$name" in
                *.nupkg | *.json | RELEASES | RELEASES-*)
                  cp "$file" "staging/$name"
                  ;;
              esac
            done

            for file in "$dir"*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              case "$name" in
                *.nupkg | *.json | RELEASES | RELEASES-*)
                  continue
                  ;;
              esac

              if [[ "$name" == *"$channel"* ]]; then
                newname="$name"
              elif [[ "$name" == *.* ]]; then
                newname="${name%.*}-${channel}.${name##*.}"
              else
                newname="${name}-${channel}"
              fi

              cp "$file" "staging/$newname"

              if [ "$newname" != "$name" ]; then
                sed -i "s|\"$name\"|\"$newname\"|g" "staging/assets.${channel}.json"
              fi
            done
          done

          echo "Staged release assets:"
          ls -1 staging

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" staging/* --repo "$GITHUB_REPOSITORY" --title "v${{ inputs.version }}" --draft
